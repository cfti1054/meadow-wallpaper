<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>초원 라이브 배경화면 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 전체 화면 WebGL 장면이 배경화면 본체. 왼쪽 위 유리 패널은 미리보기용이며 #wallpaper 로 열면 숨김 */
:root{
  --night:#05070f;
  --glass:rgba(10,14,28,.42);
  --glass-line:rgba(255,255,255,.14);
  --ink:#f3f1ea;
  --ink-dim:rgba(243,241,234,.64);
  --sun:#ffc56b;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--font-ui);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,8,.32) 100%)}
.panel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:min(320px,calc(100% - 32px));padding:14px 16px 16px;border-radius:14px;
  background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
  display:grid;gap:10px;font-size:13px;line-height:1.45}
.clock{display:flex;align-items:baseline;gap:10px}
.clock b{font-family:var(--font-num);font-size:30px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.mode{font-size:11px;letter-spacing:.08em;color:var(--sun)}
.meta{color:var(--ink-dim);font-variant-numeric:tabular-nums}
label{font-size:12px;color:var(--ink-dim)}
input[type=range]{width:100%;accent-color:var(--sun)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 > div{display:grid;gap:4px;min-width:0}
select{font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--glass-line);border-radius:8px;padding:5px 6px;width:100%}
select option{color:#111;background:#f3f1ea}
button{font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--glass-line);
  border-radius:999px;padding:5px 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--sun);color:#2a1a05;border-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.hint{color:var(--ink-dim);font-size:12px}
.reveal{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px))}
.err{position:fixed;inset:auto 16px 16px 16px;color:var(--ink);font-size:13px}
</style>

</head>
<body>
<div class="vignette"></div>
<div class="panel" id="panel">
  <div class="clock"><b id="clock">--:--</b><span class="mode" id="mode">실시간</span></div>
  <div class="meta" id="meta">서울 기준 · 일출 --:-- · 일몰 --:--</div>
  <div class="meta" id="wx">날씨 확인 중…</div>
  <div>
    <label for="hour">시간대 미리보기</label>
    <input id="hour" type="range" min="0" max="24" step="0.05" value="12">
  </div>
  <div class="grid2">
    <div><label for="season">계절</label>
      <select id="season"><option value="auto">자동 (오늘 날짜)</option><option value="spring">봄</option><option value="summer">여름</option><option value="autumn">가을</option><option value="winter">겨울</option></select></div>
    <div><label for="weather">날씨</label>
      <select id="weather"><option value="auto">실시간 (서울)</option><option value="clear">맑음</option><option value="partly">구름 조금</option><option value="cloudy">흐림</option><option value="fog">안개</option><option value="rain">비</option><option value="snow">눈</option></select></div>
  </div>
  <div class="row">
    <button id="live" aria-pressed="true">실시간</button>
    <button id="lapse" aria-pressed="false">하루 타임랩스</button>
    <button id="hide">패널 숨기기</button>
  </div>
  <div class="hint">잔디 위로 마우스를 지나가 보세요. H 키로 패널을 숨길 수 있습니다.</div>
</div>
<button class="reveal" id="reveal" hidden>패널</button>

<script src="vendor/three.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<div class="err">3D 엔진을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.</div>'); return; }

// ───────── 설정
const LAT = 37.57, LON = 126.98;           // 서울
const qs = new URLSearchParams(location.search);
const MANUAL = qs.has('manual');
const QUALITY = { low: 80000, med: 170000, high: 280000, ultra: 400000 }[qs.get('q')] || (Math.max(screen.width, screen.height) * (devicePixelRatio || 1) > 2600 ? 220000 : 170000);
const FPS_CAP = +qs.get('fps') || 0;
const TRAIL = 16;

// ───────── 유틸
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const D2R = Math.PI / 180;
const lin = h => { const c = new THREE.Color(h); return new THREE.Vector3(Math.pow(c.r, 2.2), Math.pow(c.g, 2.2), Math.pow(c.b, 2.2)); };
const vlerp = (a, b, t) => a.clone().lerp(b, t);
const fmt = h => { h = ((h % 24) + 24) % 24; const m = Math.round(h * 60); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// JS 값 노이즈 (지형용)
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy; const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), ux), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), ux), uy); }
function fbm2(x, y, o = 5) { let s = 0, a = 0.5; for (let i = 0; i < o; i++) { s += a * vnoise(x, y); x = x * 2.03 + 17.1; y = y * 2.03 + 9.3; a *= 0.5; } return s; }
function ridge(x, y) { let s = 0, a = 0.5; for (let i = 0; i < 5; i++) { const n = 1 - Math.abs(vnoise(x, y) * 2 - 1); s += a * n * n; x = x * 2.1 + 3.7; y = y * 2.1 + 1.9; a *= 0.5; } return s; }
function heightAt(x, z) {
  const D = Math.hypot(x, z);
  const mid = smooth(10, 90, D);
  let h = (Math.sin(x * 0.021 + 1.3) * Math.cos(z * 0.017 - 0.7) * 3.2 + Math.sin(x * 0.043 + z * 0.031) * 1.2 + (fbm2(x * 0.008, z * 0.008, 4) - 0.5) * 22) * mid;
  const far = smooth(420, 1100, D);
  h += far * (Math.pow(fbm2(x * 0.0017 + 4.1, z * 0.0017, 6), 1.9) * 560 * (0.55 + 0.45 * ridge(x * 0.0011, z * 0.0011)) - 25);
  return h;
}

// ───────── 천문 (태양·달)
function dayOfYear(d) { return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5); }
function solarParams(date) {
  const n = dayOfYear(date);
  const decl = 23.44 * Math.sin(2 * Math.PI * (284 + n) / 365) * D2R;
  const B = 2 * Math.PI * (n - 81) / 364;
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const tz = -date.getTimezoneOffset() / 60;
  const lat = LAT * D2R;
  const cosH = clamp((Math.sin(-0.833 * D2R) - Math.sin(lat) * Math.sin(decl)) / (Math.cos(lat) * Math.cos(decl)), -1, 1);
  const H0 = Math.acos(cosH) / D2R / 15;
  const noon = 12 + (tz * 15 - LON) / 15 - eot / 60;
  return { decl, noon, rise: noon - H0, set: noon + H0 };
}
function altAz(hourAngleDeg, decl) {
  const H = hourAngleDeg * D2R, lat = LAT * D2R;
  const sinAlt = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(H);
  const alt = Math.asin(clamp(sinAlt, -1, 1));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(lat) - Math.tan(decl) * Math.cos(lat)); // 남쪽 기준, 서쪽 +
  return { alt: alt / D2R, az: az / D2R };
}
// 화면 표시용 방향: 카메라는 남쪽(-Z)을 바라봄. 고도·방위를 살짝 압축해 해가 화면을 가로지르게 함
function displayDir(alt, az) {
  const a = (alt > 0 ? alt * 0.6 : alt) * D2R, z = az * 0.5 * D2R;
  return new THREE.Vector3(Math.sin(z) * Math.cos(a), Math.sin(a), -Math.cos(z) * Math.cos(a)).normalize();
}
function moonPhase(date) { const jd = date.getTime() / 864e5 + 2440587.5; return (((jd - 2451550.1) / 29.530588853) % 1 + 1) % 1; }

// 날짜 의존 값: 배경화면은 며칠씩 켜두므로 날짜가 바뀌면 다시 계산 (refreshDay)
let TODAY, SOL, PHASE, MOON_ILLUM, DAY_KEY = '';
function computeDay(d) {
  TODAY = d; DAY_KEY = d.toDateString();
  SOL = solarParams(d);
  PHASE = moonPhase(d);
  MOON_ILLUM = (1 - Math.cos(2 * Math.PI * PHASE)) / 2;
}
computeDay(new Date());

// ───────── 계절 팔레트
const SEASONS = {
  spring: { base: '#2a4e1a', tip: '#8db456', dry: '#c2c06c', ground: '#2e3b18', far: '#6f9b40', rock: '#3f5534', hs: 0.85, snow: 0, flower: 1 },
  summer: { base: '#22401a', tip: '#82a84a', dry: '#b0ad5a', ground: '#263412', far: '#4e7c2b', rock: '#34462f', hs: 1.12, snow: 0, flower: 0.3 },
  autumn: { base: '#38461a', tip: '#b8a85a', dry: '#b07a36', ground: '#45391c', far: '#a08a3e', rock: '#5e4630', hs: 1.0, snow: 0, flower: 0 },
  winter: { base: '#4d4a3a', tip: '#b8ad8a', dry: '#8e8268', ground: '#d7dde6', far: '#d9dfe8', rock: '#5c616b', hs: 0.6, snow: 1, flower: 0 },
};
const SEASON_KEYS = [['winter', 15], ['spring', 110], ['summer', 201], ['autumn', 298]];
function seasonWeights(name) {
  const w = { spring: 0, summer: 0, autumn: 0, winter: 0 };
  if (name !== 'auto') { w[name] = 1; return w; }
  const d = dayOfYear(TODAY);
  for (let i = 0; i < 4; i++) {
    const [a, da] = SEASON_KEYS[i], [b, db0] = SEASON_KEYS[(i + 1) % 4];
    const db = db0 < da ? db0 + 365 : db0; const dd = d < da ? d + 365 : d;
    if (dd >= da && dd < db) { const t = smooth(0, 1, (dd - da) / (db - da)); w[a] = 1 - t; w[b] = t; return w; }
  }
  w.winter = 1; return w;
}
const SEASON_NAME = { spring: '봄', summer: '여름', autumn: '가을', winter: '겨울' };

// ───────── 날씨 프리셋
const WX = {
  clear:  { cloud: 0.26, over: 0.0,  rain: 0, snow: 0, fog: 1.0, wet: 0, wind: 0.0, label: '맑음' },
  partly: { cloud: 0.52, over: 0.1,  rain: 0, snow: 0, fog: 1.1, wet: 0, wind: 0.1, label: '구름 조금' },
  cloudy: { cloud: 0.86, over: 0.55, rain: 0, snow: 0, fog: 1.5, wet: 0, wind: 0.15, label: '흐림' },
  fog:    { cloud: 0.7,  over: 0.5,  rain: 0, snow: 0, fog: 14.0, wet: 0.3, wind: -0.1, label: '안개' },
  rain:   { cloud: 1.0,  over: 0.85, rain: 1, snow: 0, fog: 2.6, wet: 1, wind: 0.35, label: '비' },
  snow:   { cloud: 1.0,  over: 0.8,  rain: 0, snow: 1, fog: 2.4, wet: 0, wind: 0.1, label: '눈' },
};
function wmoToKey(code) {
  if (code <= 1) return 'clear'; if (code === 2) return 'partly'; if (code === 3) return 'cloudy';
  if (code === 45 || code === 48) return 'fog';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  return 'rain';
}

// ───────── 렌더러 / 카메라
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: MANUAL });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MANUAL ? 1 : qs.get('q') === 'ultra' ? 2 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.setAttribute('aria-label', '시간·날씨·계절에 따라 변하는 3D 초원');
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 9000);
camera.position.set(0, 1.05, 0);
camera.lookAt(0, 1.05 + Math.tan(4 * D2R) * 100, -100);
camera.updateMatrixWorld();

// ───────── 공용 유니폼 & GLSL
const U = {
  uTime: { value: 0 }, uCamPos: { value: camera.position.clone() },
  uSunDir: { value: new THREE.Vector3(0, 1, -1).normalize() }, uMoonDir: { value: new THREE.Vector3(0, -1, 0) },
  uZenith: { value: new THREE.Vector3() }, uHorizon: { value: new THREE.Vector3() },
  uSunsetCol: { value: lin('#ff7a3a') }, uSunsetAmt: { value: 0 },
  uSunCol: { value: new THREE.Vector3() }, uSunVis: { value: 1 }, uSunLight: { value: new THREE.Vector3() },
  uOvercast: { value: 0 }, uNight: { value: 0 }, uMoonIllum: { value: MOON_ILLUM }, uMoonPhase: { value: PHASE },
  uMoonLight: { value: new THREE.Vector3() }, uMoonVis: { value: 0 },
  uAmbSky: { value: new THREE.Vector3() }, uAmbGround: { value: new THREE.Vector3() },
  uExposure: { value: 1 }, uFogDensity: { value: 0.0012 },
  uCloudCover: { value: 0.3 }, uCloudWind: { value: new THREE.Vector2(0.006, 0.002) }, uStars: { value: 0 },
};

const COMMON = /* glsl */`
uniform float uTime; uniform vec3 uCamPos;
uniform vec3 uSunDir, uMoonDir, uZenith, uHorizon, uSunsetCol, uSunCol, uSunLight, uMoonLight, uAmbSky, uAmbGround;
uniform float uSunsetAmt, uSunVis, uOvercast, uNight, uMoonIllum, uMoonPhase, uMoonVis, uExposure, uFogDensity, uCloudCover;
uniform vec2 uCloudWind;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<6;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.1,9.3); a*=0.5; } return s; }
float fbm3(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.1,9.3); a*=0.5; } return s/0.875; }
vec3 skyBase(vec3 dir){
  float y = dir.y; float yy = max(y, 0.0);
  vec3 col = mix(uHorizon, uZenith, pow(yy, 0.5));
  vec2 hd = normalize(dir.xz + 1e-5), hs = normalize(uSunDir.xz + 1e-5);
  float sd = max(dot(hd, hs), 0.0);
  float band = pow(1.0 - yy, 5.0);
  col = mix(col, uSunsetCol, clamp(uSunsetAmt * (0.3 + 0.7*pow(sd, 2.5)) * band, 0.0, 1.0));
  float mu = max(dot(dir, uSunDir), 0.0);
  col += uSunCol * (pow(mu, 6.0)*0.07 + pow(mu, 48.0)*0.4 + pow(mu, 600.0)*1.5) * uSunVis * (1.0 - uOvercast*0.85);
  float mm = max(dot(dir, uMoonDir), 0.0);
  col += vec3(0.35,0.45,0.7) * pow(mm, 60.0) * 0.06 * uMoonVis;
  if (y < 0.0) col *= mix(1.0, 0.8, clamp(-y*5.0,0.0,1.0));
  float l = dot(col, vec3(0.299,0.587,0.114));
  col = mix(col, vec3(l)*vec3(0.94,0.97,1.03)*0.72, uOvercast*0.8);
  return col;
}
float cloudDensity(vec2 uv){
  float n = fbm(uv);
  float lo = 0.86 - uCloudCover*0.72;
  return smoothstep(lo, lo + 0.26, n);
}
// 구름 그림자: 월드 좌표 위 구름 밀도 (태양 방향으로 투영)
float cloudShadow(vec3 wp){
  if (uCloudCover < 0.02) return 1.0;
  float hc = 600.0;
  vec2 xz = wp.xz + uSunDir.xz / max(uSunDir.y, 0.12) * (hc - wp.y);
  vec2 uv = xz / hc * 0.9 + uCloudWind * uTime;
  float lo = 0.86 - uCloudCover*0.72;
  float d = smoothstep(lo, lo + 0.26, fbm3(uv));
  return 1.0 - d * 0.72;
}
vec3 applyFog(vec3 col, vec3 wp){
  vec3 d = wp - uCamPos; float dist = length(d);
  vec3 dir = d / dist; dir.y = max(dir.y, 0.0) + 0.015; dir = normalize(dir);
  float f = 1.0 - exp(-dist * uFogDensity);
  f *= mix(1.0, 0.75, smoothstep(10.0, 140.0, wp.y));
  return mix(col, skyBase(dir), f);
}
vec3 tonemap(vec3 x){ x *= uExposure; x = (x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14); return pow(clamp(x,0.0,1.0), vec3(1.0/2.2)); }
`;

// ───────── 하늘 (대기·구름·별·달)
const skyMat = new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vWorld; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; gl_Position.z = gl_Position.w; }`,
  fragmentShader: COMMON + /* glsl */`
  uniform float uStars;
  varying vec3 vWorld;
  void main(){
    vec3 dir = normalize(vWorld - uCamPos);
    vec3 col = skyBase(dir);
    float y = dir.y;
    // 별
    if (uStars > 0.001 && y > 0.0) {
      vec3 p = dir * 380.0; vec3 c = floor(p); float h = hash13(c);
      if (h > 0.9965) {
        vec3 o = vec3(hash13(c+1.3), hash13(c+2.7), hash13(c+5.1));
        float dd = length(p - (c + o));
        float tw = 0.65 + 0.35*sin(uTime*(1.5+h*4.0) + h*90.0);
        float b = smoothstep(0.5, 0.0, dd) * tw * (h - 0.9965) * 300.0;
        vec3 sc = mix(vec3(1.0,0.85,0.7), vec3(0.75,0.85,1.0), hash13(c+9.1));
        col += sc * b * uStars * smoothstep(0.0, 0.25, y) * 1.1;
      }
      // 은하수 느낌의 은은한 띠
      float band = exp(-pow(dot(dir, normalize(vec3(0.6,0.35,-0.7))), 2.0) * 18.0);
      col += vec3(0.09,0.1,0.14) * band * fbm(dir.xz*6.0 + dir.y*3.0) * uStars * 0.9;
    }
    // 해
    float mu = dot(dir, uSunDir);
    col += uSunCol * smoothstep(0.99955, 0.99972, mu) * 22.0 * uSunVis * (1.0 - smoothstep(0.25, 0.75, uOvercast));
    // 달 (실제 위상)
    float md = dot(dir, uMoonDir);
    float mr = 0.021;
    if (md > cos(mr * 1.1) && uMoonDir.y > -0.05) {
      vec3 right = normalize(cross(uMoonDir, vec3(0.0,1.0,0.0)));
      vec3 upv = cross(right, uMoonDir);

    float cyc = (uTime + hash12(vec2(f, 7.7)) * P) / P;
    float c = floor(cyc), u = fract(cyc);
    vec2 hc = vec2(f * 13.1 + 1.0, c);
    float n = 3.0 + floor(hash12(hc + 0.5) * 9.0);
    if (hash12(hc + 1.7) >= uBirds || k >= n) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    float dist = 70.0 + hash12(hc + 2.3) * 110.0;
    float elev = radians(6.0 + hash12(hc + 3.9) * 12.0);
    float dirS = hash12(hc + 4.4) < 0.5 ? -1.0 : 1.0;
    float hd = (hash12(hc + 5.2) - 0.5) * 0.7;
    vec3 fwd = vec3(dirS * cos(hd), 0.0, sin(hd));
    vec3 side = vec3(-fwd.z, 0.0, fwd.x);
    float L = dist * uSpan * 2.2;
    vec3 C = vec3(0.0, uCamPos.y + dist * tan(elev), -dist) + fwd * mix(-L, L, u);
    C.y += sin(uTime * 0.25 + f * 2.0) * 2.0;
    // 대형: V자 또는 느슨한 무리
    vec3 off;
    if (hash12(hc + 6.6) < 0.5) {
      float j = ceil(k * 0.5), sd = mod(k, 2.0) < 0.5 ? 1.0 : -1.0;
      off = -fwd * j * 1.7 + side * sd * j * 1.5;
    } else {
      off = fwd * (hash12(vec2(k, c) + f) - 0.5) * 9.0 + side * (hash12(vec2(c, k) + f * 3.0) - 0.5) * 9.0 + vec3(0.0, (iBird.w - 0.5) * 3.0, 0.0);
    }
    off += vec3(sin(uTime * 0.9 + s * 20.0), sin(uTime * 0.7 + s * 11.0) * 0.6, cos(uTime * 0.8 + s * 17.0)) * 0.5;
    // 날갯짓: 가끔 활공
    float ph = uTime * (8.0 + s * 3.0) + s * 40.0;
    float glide = smoothstep(0.35, 0.65, 0.5 + 0.5 * sin(uTime * 0.35 + s * 9.0 + f));
    float amp = mix(1.0, 0.1, glide);
    float w = abs(position.z);
    float y = (sin(ph - w * 0.9) * 0.75 * w) * amp + 0.12 * w;
    vec3 lp = vec3(position.x, y, position.z) * (1.9 + 0.6 * iBird.w);
    vec3 wp = C + off + fwd * lp.x + side * lp.z + vec3(0.0, lp.y, 0.0);
    vWorld = wp;
    gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
  }`,
  fragmentShader: COMMON + /* glsl */`
  varying vec3 vWorld;
  void main(){
    vec3 c = uAmbSky * 0.22 + uSunLight * 0.025 + vec3(0.012, 0.013, 0.016);
    c = applyFog(c, vWorld);
    gl_FragColor = vec4(tonemap(c), 1.0);
  }`,
});
const birds = new THREE.Mesh(birdGeo, birdMat); birds.frustumCulled = false;
scene.add(birds);

// ───────── 나비 (낮, 봄·여름 잔디 위. 마우스가 다가가면 피함)
const BUTTER_N = 26;
const butterU = Object.assign({}, U, {
  uButter: { value: 0 }, uSpan: birdU.uSpan, uTrail: { value: trailVec }, uTrailS: { value: trailS }, uWind: grassU.uWind, uWindDir: grassU.uWindDir,
});
const butterGeo = (() => {
  // 앞날개·뒷날개(좌우) + 몸통. aW = (날개 가로 u, 날개 세로 v, 종류 0앞/1뒤/2몸통)
  const P = [], W = [];
  const quad = (x0, x1, z0, z1, kind) => {
    const v = [[x0, z0, 0, 0], [x1, z0, 1, 0], [x1, z1, 1, 1], [x0, z0, 0, 0], [x1, z1, 1, 1], [x0, z1, 0, 1]];
    for (const [x, z, u, w] of v) { P.push(x, 0, z); W.push(u, w, kind); }
  };
  for (const s of [1, -1]) { quad(-0.1, 0.55, 0, s, 0); quad(-0.6, 0.05, 0, 0.78 * s, 1); }
  quad(-0.5, 0.45, -0.05, 0.05, 2);
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('aW', new THREE.Float32BufferAttribute(W, 3));
  const a = new Float32Array(BUTTER_N * 4);
  for (let i = 0; i < BUTTER_N; i++) a.set([rnd(), 2.5 + Math.pow(rnd(), 1.3) * 11, rnd() * 2 - 1, rnd()], i * 4);
  g.setAttribute('iB', new THREE.InstancedBufferAttribute(a, 4));
  g.instanceCount = BUTTER_N;
  return g;
})();
const butterMat = new THREE.ShaderMaterial({
  uniforms: butterU, side: THREE.DoubleSide,
  defines: { TRAIL },
  vertexShader: COMMON + /* glsl */`
  uniform float uButter, uSpan, uWind; uniform vec2 uWindDir; uniform vec4 uTrail[TRAIL]; uniform float uTrailS[TRAIL];
  attribute vec3 aW; attribute vec4 iB;
  varying vec3 vW; varying float vSp; varying vec3 vWorld; varying vec3 vN;
  vec2 wander(float t, float s){ return vec2(sin(t * 1.3 + s * 9.0) * 1.6 + sin(t * 3.1 + s) * 0.5, cos(t * 1.1 + s * 4.0) * 1.2 + sin(t * 2.7 + 1.0) * 0.4); }
  void main(){
    float s = iB.x;
    if (fract(s * 7.13) >= uButter) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    float dist = iB.y;
    vec3 home = vec3(iB.z * dist * uSpan * 0.85, 0.0, -dist);
    float t = uTime * (0.22 + s * 0.12) + iB.w * 50.0;
    vec2 w0 = wander(t, s), w1 = wander(t + 0.03, s);
    vec3 p = home + vec3(w0.x, 0.0, w0.y);
    p.xz += uWindDir * uWind * sin(uTime * 0.4 + s * 6.0) * 0.4;
    float fl = uTime * (11.0 + s * 5.0) + s * 30.0;
    p.y = 0.3 + 0.28 * pow(sin(t * 1.7 + s * 5.0), 2.0) + sin(fl) * 0.015;
    // 마우스 궤적 근처면 위·바깥으로 피함
    for (int i = 0; i < TRAIL; i++) {
      float ts = uTrailS[i];
      if (ts <= 0.002) continue;
      vec2 d = p.xz - uTrail[i].xy; float l = length(d);
      if (l < 1.5) { float k = (1.5 - l) * ts; p.xz += d / (l + 1e-3) * k * 0.8; p.y += k * 0.45; }
    }
    vec2 v = w1 - w0;
    vec3 fwd = normalize(vec3(v.x, 0.0, v.y) + vec3(1e-4, 0.0, 0.0));
    vec3 side = vec3(-fwd.z, 0.0, fwd.x);
    // 날갯짓: 날개를 몸통 축으로 회전 (뒷날개는 살짝 늦게)
    float kind = aW.z;
    float th = 0.25 + 1.05 * (0.5 + 0.5 * sin(fl - (kind > 0.5 ? 0.3 : 0.0)));
    vec3 lp = position;
    float r = abs(position.z), sg = sign(position.z);
    vec3 n = vec3(0.0, 1.0, 0.0);
    if (kind < 1.5) { lp = vec3(position.x, r * sin(th), sg * r * cos(th)); n = vec3(0.0, cos(th), -sg * sin(th)); }
    lp *= 0.05 + 0.025 * fract(s * 3.3);
    vec3 wp = p + fwd * lp.x + side * lp.z + vec3(0.0, lp.y, 0.0);
    vW = aW; vSp = s; vWorld = wp; vN = fwd * n.x + side * n.z + vec3(0.0, n.y, 0.0);
    gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
  }`,
  fragmentShader: COMMON + /* glsl */`
  varying vec3 vW; varying float vSp; varying vec3 vWorld; varying vec3 vN;
  void main(){
    float kind = vW.z;
    vec3 col;
    if (kind > 1.5) { col = vec3(0.05, 0.045, 0.04); }
    else {
      // 날개 모양: 몸통 쪽이 좁은 둥근 날개 (초타원)
      vec2 q = vec2(vW.x * 2.0 - 1.0, vW.y * 2.0 - 1.0);
      float d = pow(abs(q.x), 2.4) + pow(abs(q.y), 2.4);
      if (d > 1.0) discard;
      float sp = floor(fract(vSp * 5.17) * 4.0);
      if (sp < 0.5) {        // 배추흰나비
        col = vec3(0.95, 0.95, 0.9);
        if (kind < 0.5 && q.x > 0.2 && q.y > 0.35) col = vec3(0.12);
        if (length(q - vec2(-0.1, 0.1)) < 0.16) col = vec3(0.15);
      } else if (sp < 1.5) { // 노랑나비
        col = vec3(1.0, 0.84, 0.25);
        if (d > 0.82) col *= 0.55;
      } else if (sp < 2.5) { // 주황 (제왕나비 느낌)
        col = vec3(1.0, 0.48, 0.08);
        if (abs(fract(q.x * 2.5 + q.y * 1.5) - 0.5) < 0.06) col = vec3(0.08);
        if (d > 0.7) col = fract((q.x + q.y) * 6.0) < 0.3 ? vec3(0.95) : vec3(0.06);
      } else {               // 부전나비(파랑)
        col = mix(vec3(0.3, 0.5, 1.0), vec3(0.75, 0.85, 1.0), d);
        if (d > 0.9) col = vec3(0.9);
      }
    }
    vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
    float ndl = abs(dot(N, uSunDir)) * 0.6 + 0.4;
    vec3 c = col * (uSunLight * ndl * 0.75 + uAmbSky * 1.1 + uMoonLight);
    c = applyFog(c, vWorld);
    gl_FragColor = vec4(tonemap(c), 1.0);
  }`,
});
const butterflies = new THREE.Mesh(butterGeo, butterMat); butterflies.frustumCulled = false;
scene.add(butterflies);

// ───────── 상태
const st = {
  t: 0, mode: 'live', hour: 12, season: 'auto', weatherSel: 'auto', liveWx: null, liveWind: 2.5, wxStatus: '날씨 확인 중…',
  wx: Object.assign({}, WX.clear),
  mouse: { ndc: new THREE.Vector2(), has: false, moved: false, last: null, lastAdd: 0 },
  trail: Array.from({ length: TRAIL }, () => ({ x: 0, z: 0, vx: 0, vz: 0, age: 99, amp: 0 })), ti: 0,
};

// ───────── 하늘 키프레임 (태양 실제 고도 °)
const SKY = [
  [-18, '#060b1e', '#121a33'], [-12, '#08102a', '#18213e'], [-6, '#0d1840', '#2b2e52'], [-2, '#18275a', '#77506a'],
  [0.5, '#28437e', '#e28a54'], [4, '#3362a6', '#f2b27c'], [10, '#3a74c2', '#cfdbe6'], [25, '#3570c4', '#bdd7ee'], [60, '#2763be', '#a9ccf0'],
].map(([e, z, h]) => [e, lin(z), lin(h)]);
function skyAt(e) {
  let i = 0; while (i < SKY.length - 2 && e > SKY[i + 1][0]) i++;
  const a = SKY[i], b = SKY[i + 1], t = clamp((e - a[0]) / (b[0] - a[0]), 0, 1);
  return { zen: vlerp(a[1], b[1], t), hor: vlerp(a[2], b[2], t) };
}

function currentHour() {
  if (st.mode === 'live') { const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
  return st.hour;
}

const tmp = new THREE.Vector3();
function updateEnvironment(dt) {
  const hour = currentHour();
  // 태양·달
  const ha = (hour - SOL.noon) * 15;
  const sun = altAz(ha, SOL.decl);
  const moon = altAz(ha - PHASE * 360, SOL.decl * 0.9);
  const sunDir = displayDir(sun.alt, sun.az), moonDir = displayDir(moon.alt, moon.az);
  U.uSunDir.value.copy(sunDir); U.uMoonDir.value.copy(moonDir);
  const e = sun.alt;

  // 날씨 목표값 → 부드럽게
  const key = st.weatherSel === 'auto' ? (st.liveWx || 'clear') : st.weatherSel;
  const target = WX[key];
  const k = MANUAL ? 1 : 1 - Math.exp(-dt * 0.8);
  for (const p of ['cloud', 'over', 'rain', 'snow', 'fog', 'wet', 'wind']) st.wx[p] = lerp(st.wx[p], target[p], k);
  const wx = st.wx;

  const sk = skyAt(e);
  const night = smooth(2, -10, e);
  U.uZenith.value.copy(sk.zen); U.uHorizon.value.copy(sk.hor);
  U.uSunsetAmt.value = Math.exp(-Math.pow((e - 1.5) / 5.5, 2)) * 0.85 * (1 - wx.over * 0.8);
  const warm = smooth(18, 0, e);
  const sunC = vlerp(lin('#fff3e0'), lin('#ff7a30'), warm);
  const sunI = smooth(-1.5, 6, e) * 2.6;
  U.uSunCol.value.copy(sunC).multiplyScalar(sunI);
  U.uSunVis.value = smooth(-1.2, 0.8, e);
  U.uSunLight.value.copy(sunC).multiplyScalar(sunI * (1 - wx.over * 0.78));
  U.uOvercast.value = wx.over;
  U.uNight.value = night;
  const moonVis = smooth(-2, 6, moon.alt) * (0.25 + 0.75 * MOON_ILLUM) * night;
  U.uMoonVis.value = moonVis;
  U.uMoonLight.value.copy(lin('#6f86b8')).multiplyScalar(0.11 * moonVis * (1 - wx.over * 0.6));
  const amb = vlerp(sk.zen, sk.hor, 0.4).multiplyScalar(0.9 * (1 - wx.over * 0.25));
  amb.add(tmp.set(0.02, 0.028, 0.055).multiplyScalar(night));
  U.uAmbSky.value.copy(amb);
  U.uAmbGround.value.copy(amb).multiplyScalar(0.35);
  U.uStars.value = night * (1 - wx.cloud * 0.6);
  U.uExposure.value = lerp(0.78, 1.9, night);
  U.uCloudCover.value = wx.cloud;
  U.uFogDensity.value = 0.0011 * wx.fog;
  const windSp = st.weatherSel === 'auto' ? st.liveWind : 2.5;
  grassU.uWind.value = clamp(0.22 + windSp * 0.05 + wx.wind, 0.08, 1.1);
  U.uCloudWind.value.set(0.004 + windSp * 0.0006, 0.0015);
  precipU.uRain.value = wx.rain; precipU.uSnowFall.value = wx.snow;
  rain.visible = wx.rain > 0.02; snowfall.visible = wx.snow > 0.02;

  // 계절
  const w = seasonWeights(st.season);
  const mixS = prop => { const v = new THREE.Vector3(); for (const s in w) if (w[s]) v.add(lin(SEASONS[s][prop]).multiplyScalar(w[s])); return v; };
  const mixN = prop => { let v = 0; for (const s in w) v += SEASONS[s][prop] * w[s]; return v; };
  grassU.uBase.value.copy(mixS('base')); grassU.uTip.value.copy(mixS('tip')); grassU.uDry.value.copy(mixS('dry'));
  const snowCover = smooth(0.5, 0.9, mixN('snow'));
  grassU.uSnow.value = snowCover; grassU.uHeightScale.value = mixN('hs'); grassU.uFlower.value = smooth(0.5, 1, mixN('flower'));
  grassU.uWet.value = wx.wet; terrainU.uWet.value = wx.wet * 0.7;
  terrainU.uGround.value.copy(vlerp(mixS('ground'), lin('#d7dde6'), 0).multiplyScalar(1));
  terrainU.uFieldFar.value.copy(vlerp(mixS('base'), mixS('tip'), 0.62).lerp(mixS('dry'), 0.15).multiplyScalar(1.0)).lerp(mixS('far'), snowCover); terrainU.uRock.value.copy(mixS('rock'));
  terrainU.uSnow.value = snowCover;
  floatU.uMode.value.set(w.spring > 0.5 ? 0.35 : 0, w.summer > 0.5 ? 0.6 : 0, w.autumn > 0.5 ? 0.25 : 0, w.summer > 0.5 && night < 0.5 ? 0.25 : 0);
  floaters.visible = wx.rain < 0.5 && wx.snow < 0.5;
  // 새: 낮, 특히 아침·저녁에 자주. 나비: 맑은 낮, 봄·여름 위주. 비·눈·짙은 안개면 숨김
  const calm = (1 - wx.rain) * (1 - wx.snow) * clamp((6 - wx.fog) / 4, 0, 1);
  const dusk = Math.exp(-Math.pow((e - 6) / 7, 2));
  birdU.uBirds.value = smooth(-3, 6, e) * calm * (0.35 + 0.45 * dusk);
  butterU.uButter.value = (w.spring + w.summer + 0.35 * w.autumn) * smooth(4, 14, e) * calm * (1 - wx.over * 0.6) * clamp(1.3 - grassU.uWind.value, 0, 1) * 0.8;
  birds.visible = birdU.uBirds.value > 0.01; butterflies.visible = butterU.uButter.value > 0.01;

  const sname = Object.keys(w).sort((a, b) => w[b] - w[a])[0];
  return { hour, sname, key };
}

// ───────── 마우스 → 잔디 위 궤적
const ray = new THREE.Raycaster();
function trackMouse(dt) {
  const m = st.mouse;
  for (const p of st.trail) p.age += dt;
  if (m.has && m.moved) {
    ray.setFromCamera(m.ndc, camera);
    const o = ray.ray.origin, d = ray.ray.direction;
    if (d.y < -0.01) {
      const t = (0.24 - o.y) / d.y, x = o.x + d.x * t, z = o.z + d.z * t;
      if (t < 60) {
        if (m.last) {
          const vx = (x - m.last.x) / Math.max(dt, 1e-3), vz = (z - m.last.z) / Math.max(dt, 1e-3);
          const sp = Math.hypot(vx, vz);
          const step = Math.hypot(x - m.lastAdd.x, z - m.lastAdd.z);
          if (step > 0.18 && sp > 0.2) {
            const p = st.trail[st.ti = (st.ti + 1) % TRAIL];
            const sc = Math.min(1, 3 / Math.max(sp, 1e-3));
            Object.assign(p, { x, z, vx: vx * sc / 3, vz: vz * sc / 3, age: 0, amp: clamp(0.45 + sp / 8, 0.45, 1.25) });
            m.lastAdd = { x, z };
          }
        } else m.lastAdd = { x, z };
        m.last = { x, z };
      } else m.last = null;
    } else m.last = null;
    m.moved = false;
  }
  st.trail.forEach((p, i) => {
    const a = p.age;
    trailVec[i].set(p.x, p.z, p.vx, p.vz);
    trailS[i] = a > 6 ? 0 : Math.max(0, p.amp * Math.exp(-a * 1.25) * (1 + 0.35 * Math.sin(a * 7.5) * Math.exp(-a * 1.8)));
  });
}

// ───────── 크기
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  precipU.uPx.value = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * D2R / 2));
  birdU.uSpan.value = Math.tan(camera.fov * D2R / 2) * camera.aspect;
  buildGrass();
}
let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize();

$('season').addEventListener('change', e => { st.season = e.target.value; });

const togglePanel = show => { $('panel').hidden = !show; $('reveal').hidden = show; };

addEventListener('pointermove', onMove, { passive: true });

// ───────── 실시간 날씨 (Open-Meteo, 키 불필요)
async function fetchWeather() {
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=weather_code,cloud_cover,wind_speed_10m,temperature_2m&wind_speed_unit=ms`);
    const j = await r.json();
    const c = j.current;
    st.liveWx = wmoToKey(c.weather_code); st.liveWind = c.wind_speed_10m;
    st.wxStatus = `서울 실시간 · ${WX[st.liveWx].label} · ${Math.round(c.temperature_2m)}° · 바람 ${c.wind_speed_10m.toFixed(1)}m/s`;
  } catch (err) {
    st.liveWx = null;
    st.wxStatus = '실시간 날씨에 연결하지 못해 맑음으로 표시 중 (배경화면 앱에서는 자동 연결)';
  }
}
if (!MANUAL) { fetchWeather(); setInterval(fetchWeather, 15 * 60 * 1000); }

let lastLabel = '';
function paintUI(info) {
  const s = fmt(info.hour);
  const wxText = st.weatherSel === 'auto' ? st.wxStatus : `${WX[info.key].label} (수동)`;
  const label = s + wxText + info.sname;
  if (label !== lastLabel) {
    lastLabel = label;
    ui.clock.textContent = s;
    if (st.mode !== 'preview') ui.hour.value = info.hour.toFixed(2);
    ui.wx.textContent = `${wxText} · ${SEASON_NAME[info.sname]}`;
  }
}

function frame(dt) {
  st.t += dt;
  U.uTime.value = st.t;
  if (!MANUAL) refreshDay();
  if (st.mode === 'lapse') st.hour = (st.hour + dt * 0.6) % 24;   // 하루 = 40초
  const info = updateEnvironment(dt);
  trackMouse(dt);
  renderer.render(scene, camera);
  paintUI(info);
}

if (MANUAL) {
  // 렌더링 도구용: 프레임 단위 구동
  window.__frame = (dt, o = {}) => {
    st.mode = 'preview'; if (o.hour != null) st.hour = o.hour;
    if (o.season) st.season = o.season; if (o.weather) st.weatherSel = o.weather;
    if (o.mx != null) { st.mouse.ndc.set(o.mx / innerWidth * 2 - 1, -(o.my / innerHeight) * 2 + 1); st.mouse.has = true; st.mouse.moved = true; }
    else { st.mouse.has = false; st.mouse.last = null; }
    frame(dt);
  };
  window.__ready = true;
  return;
}

let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  if (FPS_CAP) { acc += dt; last = now; if (acc < 1 / FPS_CAP) return; frame(acc); acc = 0; return; }
  last = now;
  if (document.hidden) return;
  frame(dt);
}
requestAnimationFrame(loop);
})();
</script>
